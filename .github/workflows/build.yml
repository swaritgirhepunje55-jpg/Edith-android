name: Build EDITH APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git zip unzip libffi-dev libssl-dev libpng-dev libjpeg-dev zlib1g-dev autoconf libtool pkg-config cmake openjdk-17-jdk ccache

      - name: Install Buildozer
        run: pip install buildozer cython pillow

      - name: Create icons
        run: |
          mkdir -p app/assets
          python3 -c "
          from PIL import Image, ImageDraw
          import os
          img = Image.new('RGBA', (512,512), (10,10,18,255))
          draw = ImageDraw.Draw(img)
          draw.ellipse([40,40,472,472], fill=(30,15,50,255))
          draw.ellipse([60,60,452,452], outline=(200,80,245,255), width=8)
          img.save('app/assets/edith_icon.png')
          splash = Image.new('RGB', (1080,1920), (10,10,18))
          splash.save('app/assets/splash.png')
          print('Icons done!')
          "

      - name: Build APK
        run: buildozer android debug 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EDITH-APK
          path: bin/*.apk
          retention-days: 30
